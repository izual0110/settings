name: Build devcontainers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} latest with all packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, fedora]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate devcontainer with all packages
        run: |
          bash generate-devcontainer.sh \
            --os "${{ matrix.os }}" \
            --version latest \
            --java-lts --clojure --php --go --claude --codex \
            --docker --build-tools --jq --unzip \
            --output .ci-devcontainer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .ci-devcontainer
          tags: devcontainer-ci:${{ matrix.os }}
          pull: true
          load: true
          push: false
          cache-from: type=gha,version=2,scope=devcontainer-${{ matrix.os }}
          cache-to: type=gha,version=2,scope=devcontainer-${{ matrix.os }},mode=max
